<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bjorn Cyberviking — Loot</title>
    <link rel="icon" href="web/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="web/css/styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="192x192" href="web/images/icon-192x192.png">
    <script src="web/scripts/common.js" defer></script>
    <script src="web/scripts/loot.js" defer></script>
</head>
<body>
    <nav id="app-nav" class="topnav"></nav>

    <main class="page">
        <div class="page-header">
            <div>
                <h1>Loot</h1>
                <p class="card-subtitle">Stolen files and exfiltrated data</p>
            </div>
            <div class="page-header-actions">
                <button type="button" class="btn btn-ghost" onclick="adjustLootFontSize(-1)" title="Smaller">
                    <img src="/web/images/less.png" alt="-">
                </button>
                <button type="button" class="btn btn-ghost" onclick="adjustLootFontSize(1)" title="Larger">
                    <img src="/web/images/plus.png" alt="+">
                </button>
                <button type="button" class="btn" onclick="refreshLoot()">Refresh</button>
            </div>
        </div>

        <div class="loot-container card">
            <div id="file-list"></div>
        </div>
    </main>
</body>
</html>
