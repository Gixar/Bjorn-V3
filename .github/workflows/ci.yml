name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        run: pip install pytest

      - name: Run tests
        run: pytest tests/ -v

  test-arm:
    # #14: catch Pi-only import/wheel problems that x86 misses. Still uses requirements-ci.txt
    # (no gpiozero/lgpio/spidev) and tests/_stubs.py like the x86 job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run pytest on armv7 via QEMU
        uses: uraimo/run-on-arch-action@ac33288c3728ca72563c97b8b88dda5a65a84448  # v2
        with:
          arch: armv7
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q
            apt-get install -y -q python3 python3-pip python3-venv
          run: |
            python3 -m pip install --upgrade pip
            python3 -m pip install pytest
            grep -vE '^\s*(gpiozero|lgpio|spidev)\b' requirements.txt > requirements-ci.txt || true
            python3 -m pip install -r requirements-ci.txt || true
            python3 -m pytest tests/ -v --tb=line

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pylint + the installable requirements
        run: |
          pip install 'pylint~=4.0'
          grep -vE '^\s*(gpiozero|lgpio|spidev)\b' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Lint (errors only) — core modules + the original four
        run: >
          pylint --rcfile=.pylintrc --errors-only
          retry_policy.py config_validation.py
          shared.py utils.py orchestrator.py base_connector.py telegram_client.py
          scripts/ tests/
