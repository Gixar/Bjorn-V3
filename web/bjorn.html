<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bjorn Cyberviking — e-Paper</title>
    <link rel="icon" href="web/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="web/css/styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="192x192" href="web/images/icon-192x192.png">
    <script src="web/scripts/common.js" defer></script>
</head>
<body>
    <nav id="app-nav" class="topnav"></nav>

    <div class="image-container">
        <img id="screenImage_Home" src="screen.png" alt="Bjorn e-Paper display" title="Scroll to zoom">
    </div>

    <script>
        let delay = 2000;
        let intervalId;

        function fetchWebDelay() {
            fetch("/get_web_delay")
                .then((r) => r.json())
                .then((data) => {
                    delay = data.web_delay || 2000;
                    startLiveview();
                })
                .catch(() => startLiveview());
        }

        function updateImage() {
            const image = document.getElementById("screenImage_Home");
            if (!image) return;
            const next = new Image();
            next.onload = () => { image.src = next.src; };
            next.src = "screen.png?t=" + Date.now();
        }

        function startLiveview() {
            updateImage();
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(updateImage, delay);
        }

        function stopLiveview() {
            if (intervalId) clearInterval(intervalId);
        }

        function resizeImage(event) {
            const image = document.getElementById("screenImage_Home");
            if (!image) return;
            let height = parseFloat(window.getComputedStyle(image).height);
            height = event.deltaY < 0 ? height * 1.08 : height / 1.08;
            image.style.height = height + "px";
            image.style.width = "auto";
        }

        window.addEventListener("load", () => {
            if (typeof renderNav === "function") renderNav();
            fetchWebDelay();
        });
        window.addEventListener("beforeunload", stopLiveview);
        window.addEventListener("wheel", resizeImage, { passive: true });
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) stopLiveview();
            else startLiveview();
        });
    </script>
</body>
</html>
