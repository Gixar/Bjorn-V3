<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bjorn Cyberviking — Config</title>
    <link rel="icon" href="web/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="web/css/styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="192x192" href="web/images/icon-192x192.png">
    <script src="web/scripts/common.js" defer></script>
    <script src="web/scripts/config.js" defer></script>
</head>
<body>
    <nav id="app-nav" class="topnav"></nav>

    <main class="page">
        <div class="page-header">
            <div>
                <h1>Configuration</h1>
                <p class="card-subtitle">shared_config.json · Wi-Fi · runtime toggles</p>
            </div>
            <div class="page-header-actions config-buttons">
                <button type="button" class="btn btn-primary" onclick="saveConfig()" title="Save">
                    <img src="/web/images/save.png" alt=""> Save
                </button>
                <button type="button" class="btn" onclick="restoreDefault()" title="Restore defaults">
                    <img src="/web/images/restore.png" alt=""> Defaults
                </button>
                <button type="button" class="btn" onclick="toggleWifiPanel()" title="Wi-Fi">
                    <img src="/web/images/wifi.png" alt=""> Wi-Fi
                </button>
                <button type="button" class="btn btn-ghost" onclick="adjustConfigFontSize(-1)" title="Smaller">
                    <img src="/web/images/less.png" alt="-">
                </button>
                <button type="button" class="btn btn-ghost" onclick="adjustConfigFontSize(1)" title="Larger">
                    <img src="/web/images/plus.png" alt="+">
                </button>
            </div>
        </div>

        <div class="config-container">
            <form class="config-form"></form>
        </div>
    </main>

    <div id="wifi-panel" class="wifi-panel">
        <div class="wifi-panel-header">
            <h3>Available Wi-Fi Networks</h3>
            <button class="close-btn" onclick="closeWifiPanel()" aria-label="Close">✖</button>
        </div>
        <ul id="wifi-list"></ul>
    </div>
</body>
</html>
